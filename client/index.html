<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>TajerDrop — Dropshipping COD au Maroc, sans stock</title>
    <meta name="description" content="TajerDrop est la plateforme marocaine de dropshipping COD : vendez sans stock, nous confirmons par centre d'appel, emballons et livrons dans toutes les villes. Vous ne payez que sur les commandes livrées." />
    <meta name="keywords" content="dropshipping Maroc, COD Maroc, vendre sans stock, TajerDrop, confirmation commandes, livraison Maroc, YouCan, Shopify Maroc" />
    <link rel="canonical" href="https://tajerdrop.com/" />

    <!-- Versions linguistiques. Sans ces liens, Google traite l'accueil arabe
         et l'accueil francais comme du contenu duplique et n'en retient qu'un,
         souvent celui qui ne correspond pas a la langue du chercheur. -->
    <link rel="alternate" hreflang="ar-MA" href="https://tajerdrop.com/" />
    <link rel="alternate" hreflang="fr-MA" href="https://tajerdrop.com/fr" />
    <link rel="alternate" hreflang="x-default" href="https://tajerdrop.com/" />
    <meta name="theme-color" content="#0F172A" />

    <!-- Favicons. Le SVG d'abord : net a toute taille et sur tout ecran.
         Les PNG restent pour les navigateurs qui l'ignorent encore. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- iOS home screen -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="TajerDrop" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Android / PWA install -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (WhatsApp / Facebook / LinkedIn share preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TajerDrop" />
    <meta property="og:title" content="TajerDrop — Dropshipping COD au Maroc, sans stock" />
    <meta property="og:description" content="Vendez sans stock. Nous confirmons, emballons et livrons dans toutes les villes. Vous ne payez que sur les commandes livrées." />
    <meta property="og:url" content="https://tajerdrop.com/" />
    <meta property="og:image" content="https://tajerdrop.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ar_MA" />
    <meta property="og:locale:alternate" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TajerDrop — Dropshipping COD au Maroc, sans stock" />
    <meta name="twitter:description" content="Vendez sans stock. Nous confirmons, emballons et livrons dans toutes les villes. Vous ne payez que sur les commandes livrées." />
    <meta name="twitter:image" content="https://tajerdrop.com/og-image.png" />

    <!-- Search engine indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Donnees structurees. Organization et non SoftwareApplication : on ne
         vend pas un logiciel par abonnement mais un service de dropshipping.
         L'ancien bloc annoncait 299 DH/mois a Google, ce qui est faux depuis
         que l'inscription est gratuite et la facturation a la livraison. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TajerDrop",
      "url": "https://tajerdrop.com/",
      "logo": "https://tajerdrop.com/android-chrome-512.png",
      "description": "Plateforme marocaine de dropshipping COD : catalogue sans stock, confirmation par centre d'appel, emballage et livraison dans tout le Maroc.",
      "areaServed": { "@type": "Country", "name": "Maroc" }
    }
    </script>

    <!-- Fonts (kept as-is — the app uses ~20 families across components) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&family=Cairo:wght@300..900&family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
