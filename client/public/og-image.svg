<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Image de partage (WhatsApp, Facebook, LinkedIn).

    Composee en arabe et alignee a droite : c'est la langue de la page
    d'accueil et celle des vendeurs vises. Un aperçu en francais renverrait
    vers une page arabe, et l'ecart se lit comme une erreur de lien.

    Le texte reste gros et court. Une image de partage est vue en vignette
    dans une conversation, souvent sur telephone : tout ce qui demande a etre
    lu de pres est perdu.
  -->
  <defs>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0F172A"/>
  <circle cx="1120" cy="80" r="360" fill="url(#glowA)"/>
  <circle cx="90" cy="600" r="300" fill="url(#glowB)"/>

  <!-- ── Marque, en haut a droite (sens de lecture arabe) ── -->
  <g transform="translate(1032,58)">
    <rect x="0" y="4" width="34" height="8" rx="3.5" fill="#ffffff"/>
    <path d="M13 12h8v15h-8z" fill="#ffffff"/>
    <path d="M17 25c0 0 9 9.7 9 15.1 0 4.7-4 7.4-9 7.4s-9-2.7-9-7.4C8 34.7 17 25 17 25z" fill="#FF6B35"/>
  </g>
  <text x="1010" y="96" font-family="DejaVu Sans" font-size="38" font-weight="bold"
        fill="#ffffff" text-anchor="end">Tajer<tspan fill="#FF6B35">Drop</tspan></text>

  <!-- Titre. Pas d'attribut direction : l'algorithme bidi deduit le sens des
       caracteres eux-memes, alors que le combiner a text-anchor="end" faisait
       sortir le texte du cadre. Seul l'ancrage a droite est declare. -->
  <text x="1120" y="246" font-family="DejaVu Sans" font-size="74" font-weight="bold"
        fill="#ffffff" text-anchor="end">بيع أونلاين بلا ستوك</text>
  <text x="1120" y="344" font-family="DejaVu Sans" font-size="74" font-weight="bold"
        fill="#FF6B35" text-anchor="end">وبلا مخاطرة</text>

  <!-- ── Promesse ── -->
  <text x="1120" y="416" font-family="DejaVu Sans" font-size="30"
        fill="#ffffff" fill-opacity="0.72" text-anchor="end">حنا كانتكلّفو بالتأكيد، التغليف والتوصيل</text>

  <!-- Les trois reperes tiennent dans un seul texte, separes par des points
       medians : positionner trois blocs a la main supposait de connaitre la
       largeur de chacun, et ils se chevauchaient. -->
  <text x="1120" y="500" font-family="DejaVu Sans" font-size="27"
        fill="#ffffff" fill-opacity="0.85" text-anchor="end">جميع المدن · الخلاص عند التوصيل · بلا راس مال</text>

  <!-- ── Adresse ── -->
  <text x="1120" y="576" font-family="DejaVu Sans" font-size="26" font-weight="bold"
        fill="#FF6B35" text-anchor="end">tajerdrop.com</text>
</svg>
